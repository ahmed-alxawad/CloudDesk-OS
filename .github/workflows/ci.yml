name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the project's established release-build Rust version
      # (also used by the pinned Rocky/Alpine release Docker builders)
      # rather than dtolnay/rust-toolchain@stable's unbound "whatever is
      # current stable today" -- an unrelated clippy lint added in a
      # newer stable release otherwise fails CI on unchanged source with
      # no actual defect (confirmed: the exact `cargo clippy --workspace
      # --all-targets -- -D warnings` command below passes cleanly under
      # 1.97.1 locally).
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned by commit
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
