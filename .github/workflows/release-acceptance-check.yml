# Publication Pass K1: v1.0.1-rc.5's release-attest workflow run
# (33429519775) failed the true-stdin bootstrap acceptance step on a
# real GitHub Actions runner in a way that never reproduced locally,
# and release-attest.yml only ever runs on a pushed release tag -- so
# there was no way to get real hosted evidence that a fix to
# tests/distro/release-acceptance.sh actually works on this
# infrastructure without pushing another release tag (and risking
# repeating the same failure against a second immutable tag).
#
# This workflow runs the SAME acceptance scripts release-attest.yml
# uses (tests/distro/release-acceptance.sh,
# tests/distro/installer-lib-sync.sh, and the setup_origin_https test
# suite) against a real build on an ordinary push to main -- no tag, no
# attestation, no release. It exists purely to get hosted proof the
# acceptance harness itself works before a release tag is ever created,
# and should stay in sync with release-attest.yml's build/stage/test
# steps (deliberately not the same file: this one never attests or
# publishes anything).
#
# Publication Pass K2 found this workflow's original `paths:` filter
# (installer/**, packaging/**, tests/distro/**, ...) too narrow: a pure
# version-bump-and-release-notes commit -- exactly the kind of commit
# that becomes a release candidate's tag target -- doesn't touch any of
# those paths, so it silently never got hosted-verified at all. Runs on
# every push to main instead, since the whole point is to gate any
# commit that might become a release tag, not just ones that happen to
# touch installer-shaped files. workflow_dispatch is added for a manual
# re-run against the current main without needing a new commit.
name: Release acceptance check (non-release)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-release-acceptance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned by commit per supply-chain review, Publication Pass A)

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned by commit per supply-chain review, Publication Pass B)
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch, pinned by commit
      - uses: Swatinem/rust-cache@v2

      - name: Build glibc release artifacts
        run: bash packaging/build-release.sh dist/linux-x86_64-glibc

      - name: Build musl release artifacts
        run: bash packaging/build-release-musl.sh dist/linux-x86_64-musl

      - name: Build web frontend bundle
        run: bash packaging/build-web.sh dist

      # Non-release stand-in for release-attest.yml's real manifest
      # (which binds to a tag): a fixed test version/commit, since this
      # workflow never attests or publishes anything under it.
      - name: Stage flat public release asset layout (non-release check)
        run: |
          mkdir -p release-assets
          version="0.0.0-rc.1"
          cp dist/linux-x86_64-glibc/clouddeskd    release-assets/clouddeskd-linux-x86_64-glibc
          cp dist/linux-x86_64-glibc/cloudesk-privd release-assets/cloudesk-privd-linux-x86_64-glibc
          cp dist/linux-x86_64-glibc/cloudesk-sessiond release-assets/cloudesk-sessiond-linux-x86_64-glibc
          cp dist/linux-x86_64-musl/clouddeskd     release-assets/clouddeskd-linux-x86_64-musl
          cp dist/linux-x86_64-musl/cloudesk-privd  release-assets/cloudesk-privd-linux-x86_64-musl
          cp dist/linux-x86_64-musl/cloudesk-sessiond release-assets/cloudesk-sessiond-linux-x86_64-musl
          cp dist/clouddesk-web.tar.gz release-assets/clouddesk-web.tar.gz
          cp installer/install.sh release-assets/install.sh
          {
            printf '%s  linux-x86_64-glibc/clouddeskd\n' "$(sha256sum dist/linux-x86_64-glibc/clouddeskd | cut -d' ' -f1)"
            printf '%s  linux-x86_64-glibc/cloudesk-privd\n' "$(sha256sum dist/linux-x86_64-glibc/cloudesk-privd | cut -d' ' -f1)"
            printf '%s  linux-x86_64-glibc/cloudesk-sessiond\n' "$(sha256sum dist/linux-x86_64-glibc/cloudesk-sessiond | cut -d' ' -f1)"
            printf '%s  linux-x86_64-musl/clouddeskd\n' "$(sha256sum dist/linux-x86_64-musl/clouddeskd | cut -d' ' -f1)"
            printf '%s  linux-x86_64-musl/cloudesk-privd\n' "$(sha256sum dist/linux-x86_64-musl/cloudesk-privd | cut -d' ' -f1)"
            printf '%s  linux-x86_64-musl/cloudesk-sessiond\n' "$(sha256sum dist/linux-x86_64-musl/cloudesk-sessiond | cut -d' ' -f1)"
            printf '%s  clouddesk-web.tar.gz\n' "$(sha256sum dist/clouddesk-web.tar.gz | cut -d' ' -f1)"
            printf '%s  installer/install.sh\n' "$(sha256sum installer/install.sh | cut -d' ' -f1)"
          } > release-assets/SHA256SUMS
          printf '{\n  "release_candidate": "%s",\n  "source_commit": "%s"\n}\n' "$version" "$GITHUB_SHA" > release-assets/manifest.json

      - name: Verify embedded installer unit content matches packaging/ (fail closed)
        run: bash tests/distro/installer-lib-sync.sh

      - name: True stdin public-bootstrap acceptance -- Debian & Alpine (fail closed)
        run: bash tests/distro/release-acceptance.sh release-assets 0.0.0-rc.1

      - name: Setup same-origin request acceptance -- HTTP/1.1 & HTTP/2 (fail closed)
        run: cargo test -p clouddeskd --test setup_origin_https -- --test-threads=1
