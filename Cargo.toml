[workspace]
resolver = "2"
members = [
  "crates/audit",
  "crates/auth",
  "crates/config",
  "crates/db",
  "crates/linux",
  "crates/media",
  "crates/permissions",
  "crates/privilege",
  "crates/remote",
  "crates/runtime",
  "crates/secrets",
  "crates/vfs",
  "crates/vault",
  "crates/transfers",
  "services/clouddeskd",
  "services/cloudesk-sessiond",
  "tests/acceptance",
]

[workspace.package]
version = "1.0.1-rc.1"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/clouddesk-os/clouddesk-os"

[workspace.dependencies]
anyhow = "1"
aes-gcm = "0.10"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
cap-std = "3"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
rustix = { version = "1", features = ["process"] }
rand = "0.8"
nix = { version = "0.30", features = ["fs", "user"] }
portable-pty = "0.9"
sha1 = "0.10"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tempfile = "3"
thiserror = "2"
subtle = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
