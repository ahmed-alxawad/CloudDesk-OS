# CloudDesk OS — Nginx Configuration
# Copy this file to /etc/nginx/sites-available/clouddesk
# Then: sudo ln -s /etc/nginx/sites-available/clouddesk /etc/nginx/sites-enabled/
# And:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    # ── Security Headers ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; worker-src 'self' blob:" always;

    # ── Rate Limiting ──
    # Uncomment and configure if behind a public IP
    # limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    # limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # limit_req zone=auth burst=5 nodelay;

    # ── Upload Size ──
    client_max_body_size 10G;
    client_body_buffer_size 128k;

    # ── Timeouts ──
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;
    keepalive_timeout 65;

    # ── Frontend Static Files ──
    location / {
        root /opt/clouddesk/frontend/dist;
        index index.html;

        # SPA fallback — serve index.html for all unknown routes
        try_files $uri $uri/ /index.html;

        # Cache static assets aggressively
        # NOTE: nginx does NOT inherit add_header from parent when this block
        # defines its own add_header, so ALL security headers must be repeated.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            # Repeat security headers (required — nginx does not inherit in nested locations)
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; worker-src 'self' blob:" always;

            expires 1y;
            add_header Cache-Control "public, immutable" always;
            access_log off;
        }
    }

    # ── API Proxy ──
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ── WebSocket Proxy (IDE) ──
    location /api/v1/ide/proxy/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── WebSocket Proxy (Terminal PTY) ──
    location /api/v1/terminal/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long-lived WebSocket connections (terminal sessions can be hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Health Check ──
    location /api/health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }

    # ── Block Sensitive Paths ──
    location ~ /\.(git|env|htaccess|htpasswd) {
        return 404;
    }
}
