version: '3.8'

services:
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 admin password123;
      /usr/bin/mc mb myminio/test-bucket;
      exit 0;
      "

  webdav:
    image: bytemark/webdav
    environment:
      AUTH_TYPE: Basic
      USERNAME: testuser
      PASSWORD: testpassword
    ports:
      - "8080:80"

  openssh:
    image: lscr.io/linuxserver/openssh-server
    environment:
      USER_NAME: testuser
      USER_PASSWORD: testpassword
      SUDO_ACCESS: "false"
      PASSWORD_ACCESS: "true"
    ports:
      - "2222:2222"
    volumes:
      # AllowTcpForwarding is off by default in this image; ProxyJump
      # (direct-tcpip channels) needs it on the bastion. See
      # fixtures/sshd_config.d/proxyjump.conf for why this specific path.
      - ./fixtures/sshd_config.d:/config/sshd/sshd_config.d:ro
      # Phase 2 closure: the disposable test-only CA public key
      # advanced_auth.conf's TrustedUserCAKeys points at.
      - ./fixtures/ssh_ca:/config/ssh_ca:ro
      # Phase 2 closure: keyboard-interactive needs a real, working
      # PAM stack to actually source a challenge from (UsePAM yes) --
      # this minimal image's own /etc/pam.d/sshd already `include`s
      # base-auth/base-account/base-password/base-session, but none of
      # those files exist in the base image (a real, live-found gap).
      # Mounted per-file, not as a directory, so the rest of
      # /etc/pam.d (chsh, shadow-utils, sshd itself) is left intact.
      - ./fixtures/pam.d/base-auth:/etc/pam.d/base-auth:ro
      - ./fixtures/pam.d/base-account:/etc/pam.d/base-account:ro
      - ./fixtures/pam.d/base-password:/etc/pam.d/base-password:ro
      - ./fixtures/pam.d/base-session:/etc/pam.d/base-session:ro

  # ProxyJump target. Deliberately has NO host port mapping: the only way
  # to reach it at all is through the compose-internal network, i.e.
  # through the `openssh` bastion above -- so a live test that succeeds
  # here proves the connection genuinely went client -> bastion -> target,
  # not that the "target" was independently host-reachable all along.
  openssh-target:
    image: lscr.io/linuxserver/openssh-server
    environment:
      USER_NAME: targetuser
      USER_PASSWORD: targetpassword
      SUDO_ACCESS: "false"
      PASSWORD_ACCESS: "true"
    volumes:
      # Same CA trust as the bastion, so a Task 13/35 "certificate
      # through ProxyJump" test can authenticate the *target* hop with
      # a certificate while the bastion hop still uses its existing
      # password auth -- proving the two hops carry independent
      # credentials through a real ProxyJump tunnel.
      - ./fixtures/ssh_ca:/config/ssh_ca:ro
      - ./fixtures/sshd_config.d/advanced_auth_target.conf:/config/sshd/sshd_config.d/advanced_auth.conf:ro
