# Phase 2 SSH closure: enables the two auth methods the base
# linuxserver/openssh-server image doesn't turn on by default.
#
# TrustedUserCAKeys: OpenSSH user-certificate authentication. The CA
# key pair here (tests/acceptance/fixtures/ssh_ca/) is a disposable,
# test-only artifact with no purpose beyond signing short-lived
# certificates for this local fixture -- not a real secret, matching
# this same directory's existing "testpassword"/"targetpassword"
# convention.
TrustedUserCAKeys /config/ssh_ca/ca.pub

# KbdInteractiveAuthentication: real RFC 4256 keyboard-interactive.
# Real, live-found gap: this image's own default is UsePAM no, so
# even with KbdInteractiveAuthentication on there is nothing to
# actually source a challenge from -- sshd immediately fails the
# method with zero InfoRequest rounds (confirmed live). UsePAM yes
# routes it through a real PAM conversation (pam_unix, see
# fixtures/pam.d/) that presents the account's real Unix password as
# a single keyboard-interactive prompt -- a real, deterministic,
# automatable challenge/response exchange against real sshd, not a
# custom test-only protocol shim.
KbdInteractiveAuthentication yes
UsePAM yes

# This disposable fixture's own test suite deliberately generates many
# real failed-authentication attempts in quick succession (denial
# matrices for agent/keyboard-interactive/certificate auth), all from
# the same source address (the test host). OpenSSH 9.8+'s own
# `PerSourcePenalties` rate-limiting (real, live-found this pass: it
# penalizes the *source IP*, not the specific failed credential) then
# drops even the *next test's* legitimate connection attempt for
# ~15s, producing spurious "Disconnected" failures unrelated to
# CloudDesk's own auth code. Disabled here because this is disposable
# test infrastructure exercising deliberate hostile-input matrices by
# design, not a production security boundary.
PerSourcePenalties no
