# Enables TCP forwarding on the disposable bastion fixture, required for
# ProxyJump (SSH direct-tcpip channels). Off by default in this image.
# Mounted into /config/sshd/sshd_config.d, which the image's own init
# script auto-enables via Include when that directory is present -- see
# /etc/s6-overlay/s6-rc.d/init-openssh-server-config/run in the
# lscr.io/linuxserver/openssh-server image ("Enable sshd_config.d if
# mounted").
AllowTcpForwarding yes
